name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and parser submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build GTA binary helper
        run: dotnet build .\binary_helper\ClothFixer.Binary.csproj --configuration Release
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
